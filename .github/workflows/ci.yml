# CI = Continuous Integration: every push / PR is automatically checked
# on a fresh GitHub-hosted machine, so broken code is caught early.

name: CI

# When should this workflow run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Values available to every job. They come from
# GitHub → repo Settings → Secrets and variables → Actions → Variables tab.
# (NEXT_PUBLIC_* are public anyway, so "variables" is fine — not "secrets".)
env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------- Job 1: lint + build the app with plain Node ----------
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm            # reuse downloaded packages between runs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------- Job 2: build the image, push it to GHCR on main ----------
  docker:
    needs: check              # only runs if "check" passed
    runs-on: ubuntu-latest
    permissions:
      contents: read          # to check out the code
      packages: write         # to push images to ghcr.io
    env:
      # GHCR image names must be lowercase
      IMAGE: ghcr.io/alicheema77/viscon-engineering
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is created automatically for every run — no secret to add
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}   # PRs: build only
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ env.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ env.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha              # reuse layers from earlier runs
          cache-to: type=gha,mode=max