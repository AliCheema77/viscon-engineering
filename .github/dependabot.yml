# Dependabot = a GitHub bot that checks for newer versions of what we use
# and opens a pull request for each update. CI then tests that PR for us.

version: 2
updates:
  # 1. npm packages (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # bundle small, safe updates into ONE PR instead of many
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions can break the build — upgrade these by hand when ready.
    # Minor/patch updates for them still come through.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"          # must match Node 22 we run
        update-types: [version-update:semver-major]

  # 2. GitHub Actions used in .github/workflows (checkout, setup-node, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # 3. Docker base image in the Dockerfile (node:22-alpine)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # stay on Node 22 LTS; bump the major version by hand
      - dependency-name: node
        update-types: [version-update:semver-major]